import java.awt.BasicStroke
import java.awt.Color
import java.awt.GradientPaint
import java.awt.Graphics2D
import java.awt.RenderingHints
import java.awt.image.BufferedImage
import java.awt.image.DataBufferInt
import java.util.Random
import javax.imageio.ImageIO

plugins {
    id 'com.android.application'
}

def rallyResources = layout.buildDirectory.dir('generated/rally-res')

android {
    namespace 'com.hmaad.tabletennis'
    compileSdk 34
    defaultConfig {
        applicationId "com.hmaad.tabletennis"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.main.res.srcDir(rallyResources)
}

// Draw the app's original arena and tabletop textures during the normal Gradle build.
// This keeps binary art out of Git while shipping the finished, high-resolution art in the APK.
tasks.register('generateRallyArtwork') {
    outputs.dir(rallyResources)
    doLast {
        File out = new File(rallyResources.get().asFile, 'drawable-nodpi')
        out.mkdirs()
        def makeImage = { int w, int h, boolean portrait ->
            BufferedImage image = new BufferedImage(w, h, BufferedImage.TYPE_INT_RGB)
            int[] pixels = ((DataBufferInt) image.getRaster().getDataBuffer()).getData()
            Random noise = new Random(portrait ? 17L : 29L)
            for (int y = 0; y < h; y++) {
                double t = (double) y / (double) h
                for (int x = 0; x < w; x++) {
                    double glowX = (double) x / (double) w - 0.5d
                    double glowY = t - (portrait ? 0.43d : 0.46d)
                    double glow = Math.max(0d, 1d - Math.sqrt(glowX * glowX * 2.8d + glowY * glowY * 2.2d))
                    int r, g, b
                    if (portrait) {
                        r = (int) (5 + t * 3 + glow * 4)
                        g = (int) (13 + t * 18 + glow * 34)
                        b = (int) (27 + t * 25 + glow * 48)
                    } else if (t < 0.18d) {
                        r = 3; g = 9; b = 18
                    } else if (t < 0.59d) {
                        r = (int) (8 + glow * 6); g = (int) (20 + glow * 29); b = (int) (34 + glow * 45)
                    } else {
                        double floor = (t - 0.59d) / 0.41d
                        r = (int) (12 - floor * 8); g = (int) (38 - floor * 24); b = (int) (58 - floor * 37)
                    }
                    int grain = noise.nextInt(5) - 2
                    r = Math.max(0, Math.min(255, r + grain))
                    g = Math.max(0, Math.min(255, g + grain))
                    b = Math.max(0, Math.min(255, b + grain))
                    pixels[y * w + x] = 0xFF000000 | (r << 16) | (g << 8) | b
                }
            }
            Graphics2D art = image.createGraphics()
            art.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            art.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
            if (portrait) {
                art.setColor(new Color(75, 195, 220, 35))
                for (int i = 0; i < 9; i++) art.drawArc(-180, 70 + i * 76, w + 360, 620, 15, 150)
                art.setColor(new Color(62, 206, 235, 32)); art.setStroke(new BasicStroke(3f))
                art.drawLine(82, 170, 82, 1510); art.drawLine(w - 82, 170, w - 82, 1510)
                art.setColor(new Color(5, 17, 31, 150))
                int[] xs = [0, w.intdiv(2), w, w, 0] as int[]; int[] ys = [1510, 1370, 1510, h, h] as int[]; art.fillPolygon(xs, ys, xs.length)
                art.setColor(new Color(42, 197, 224, 105)); art.setStroke(new BasicStroke(4f))
                art.drawLine(0, 1510, w.intdiv(2), 1370); art.drawLine(w.intdiv(2), 1370, w, 1510)
                for (int y = 1590; y < h; y += 100) art.drawLine(80, y, w - 80, y - 8)
            } else {
                art.setColor(new Color(3, 9, 17, 170)); art.fillRect(0, 0, w, 170)
                art.setColor(new Color(90, 156, 177, 58)); art.setStroke(new BasicStroke(5f))
                for (int i = 0; i < 12; i++) art.drawArc(-300 + i * 230, -500, 950, 930, 18, 150)
                for (int x : [125, 490, 960, 1430, 1790]) {
                    art.setColor(new Color(183, 239, 250, 225)); art.fillRoundRect(x - 49, 122, 98, 19, 12, 12)
                    art.setColor(new Color(82, 217, 245, 58)); art.fillOval(x - 94, 122, 188, 34)
                }
                art.setColor(new Color(8, 23, 40, 255));
                int[] xs = [0, w, w, 0] as int[]; int[] ys = [258, 228, 610, 642] as int[]; art.fillPolygon(xs, ys, xs.length)
                Random seats = new Random(5L)
                for (int row = 0; row < 12; row++) {
                    int y = 280 + row * 26, offset = (row % 2) * 11
                    for (int x = -8 + offset; x < w; x += 24) {
                        int choice = seats.nextInt(5)
                        int red = 24, green = 49, blue = 72
                        if (choice == 1) { red = 31; green = 67; blue = 92 }
                        else if (choice == 2) { red = 19; green = 42; blue = 62 }
                        else if (choice == 3) { red = 28; green = 54; blue = 78 }
                        else if (choice == 4) { red = 17; green = 38; blue = 57 }
                        art.setColor(new Color(red, green, blue, 255)); art.fillOval(x, y, 7, 5)
                        if (Math.floorMod(x.intdiv(24) + row, 5) == 0) { art.setColor(new Color(91, 181, 199, 145)); art.fillOval(x + 9, y + 1, 3, 4) }
                    }
                }
                art.setColor(new Color(52, 142, 174, 75)); art.setStroke(new BasicStroke(3f))
                for (int y : [311, 421, 532, 626]) art.drawLine(0, y, w, y - 24)
                art.setColor(new Color(28, 105, 140, 180))
                for (int x : [45, w - 45]) art.fillRoundRect(x - 19, 300, 38, 298, 18, 18)
                art.setColor(new Color(88, 218, 247, 180)); art.setStroke(new BasicStroke(4f))
                for (int x : [45, w - 45]) art.drawLine(x, 315, x, 580)
                art.setPaint(new GradientPaint(0, 600, new Color(14, 41, 62), 0, h, new Color(4, 13, 25)))
                art.fillRect(0, 600, w, h - 600)
                art.setColor(new Color(39, 126, 157, 42)); art.setStroke(new BasicStroke(2f))
                for (int y = 650; y < h; y += 70) art.drawLine(0, y, w, y - 10)
                for (int x : [130, 450, 960, 1470, 1790]) art.drawLine(x, 620, (int) (x + (x - 960) / 4), h)
                art.setColor(new Color(44, 211, 241, 82)); art.setStroke(new BasicStroke(5f)); art.drawLine(0, 604, w, 577)
            }
            art.dispose()
            return image
        }
        ImageIO.write(makeImage(1920, 1080, false), 'png', new File(out, 'arena_landscape.png'))
        ImageIO.write(makeImage(1080, 1920, true), 'png', new File(out, 'arena_portrait.png'))

        BufferedImage surface = new BufferedImage(1024, 1024, BufferedImage.TYPE_INT_RGB)
        int[] pixels = ((DataBufferInt) surface.getRaster().getDataBuffer()).getData()
        Random grain = new Random(34L)
        for (int y = 0; y < 1024; y++) for (int x = 0; x < 1024; x++) {
            int n = grain.nextInt(33) - 16
            int r = Math.max(0, 10 + n / 4), g = Math.max(0, Math.min(255, 74 + y / 45 + n)), b = Math.max(0, Math.min(255, 109 + y / 30 + n))
            pixels[y * 1024 + x] = 0xFF000000 | (r << 16) | (g << 8) | b
        }
        ImageIO.write(surface, 'png', new File(out, 'court_surface.png'))

        BufferedImage icon = new BufferedImage(512, 512, BufferedImage.TYPE_INT_RGB)
        Graphics2D g = icon.createGraphics(); g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
        g.setPaint(new GradientPaint(0, 0, new Color(5, 16, 30), 0, 512, new Color(9, 60, 78))); g.fillRect(0, 0, 512, 512)
        g.setColor(new Color(16, 113, 150, 80)); g.fillOval(55, 42, 402, 402)
        g.setColor(new Color(66, 220, 242, 220)); g.setStroke(new BasicStroke(8f)); g.drawOval(55, 42, 402, 402)
        g.setColor(new Color(15, 119, 157)); g.fillPolygon([91,421,373,139] as int[], [303,303,389,389] as int[], 4)
        g.setColor(new Color(226,249,255)); g.setStroke(new BasicStroke(7f)); g.drawLine(91,303,421,303)
        g.setColor(new Color(255,80,100)); g.fillOval(270,102,117,130); g.setColor(new Color(255,211,218)); g.setStroke(new BasicStroke(8f)); g.drawOval(270,102,117,130)
        g.setColor(new Color(244,248,250)); g.setStroke(new BasicStroke(21f)); g.drawLine(319,205,370,292)
        g.setColor(new Color(255,190,59)); g.fillOval(155,129,47,47); g.setColor(new Color(69,226,243)); g.setStroke(new BasicStroke(7f)); g.drawLine(121,147,91,139); g.drawLine(128,174,103,184)
        g.dispose(); ImageIO.write(icon, 'png', new File(out, 'rally_icon.png'))
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('generateRallyArtwork') }

